[project]
name = "deltaforcescript"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colormath==3.0.0",
    "dxcam>=0.0.5",
    "numpy>=2.3.5",
    "paddleocr>=3.3.2",
    "pillow>=12.0.0",
    "pydirectinput>=1.0.4",
    "pyqt6>=6.10.1",
    "pywin32>=311",
]


[tool.uv]
environments = [
    "sys_platform == 'win32'",  # 只为 Windows 解析依赖
]

[[tool.uv.index]]
name = "paddlepaddle"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

